[pytest]
# mcd-ai-content-platform pytest 配置（Phase 8）
# 兼容 verify.py 单文件测试脚本 + 未来按模块拆分的 test_*.py
testpaths = tests
python_files = verify.py test_*.py *_test.py
python_functions = test_*
python_classes = Test*

# 中文输出 + UTF-8（Handoff §7 教训：避免 GBK codec 报错）
addopts = -ra --strict-markers --tb=short

# 标记（按 Phase 划分，方便筛选）
markers =
    phase1: Phase 1 CTR Adapter 测试
    phase2: Phase 2 copy-analyzer Adapter 测试
    phase3: Phase 3 业务页面基础设施测试
    phase4: Phase 4 三个业务页面测试
    phase5: Phase 5 CTR 反哺闭环测试
    phase6: Phase 6 业务确认 + 灰态 + 口径测试
    phase7: Phase 7 业务拍板落地测试

# UTF-8 输出：通过 PYTHONIOENCODING=utf-8 调 pytest 命令保证（Handoff §7 教训）
# 注意：pytest 9.1 已不支持 [pytest] env 选项，改在调用方设环境变量