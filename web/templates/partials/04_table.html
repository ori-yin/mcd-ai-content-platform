{# partials/04_emoji.html — Tab 3: Emoji 表现 #}

<form method="get" action="/insights" class="form-grid form-grid-tri">
  <div class="form-row">
    <label>最少 plan 数</label>
    <select name="ef_min_plans">
      {% for v in [1,2,3,5,10,20,50] %}
      <option value="{{ v }}" {% if params.ef_min_plans|string == v|string %}selected{% endif %}>{{ v }}</option>
      {% endfor %}
    </select>
  </div>
  <div class="form-row">
    <label>前 N 个 emoji</label>
    <select name="ef_top_n">
      {% for v in [5,10,20,30,50,100] %}
      <option value="{{ v }}" {% if params.ef_top_n|string == v|string %}selected{% endif %}>{{ v }}</option>
      {% endfor %}
    </select>
  </div>
  <div class="form-row">
    <button type="submit" class="btn btn-dark btn-sm">查询</button>
  </div>
</form>

{% if not df_rows %}
<div class="warning-banner">emoji 数据为空</div>
{% else %}
<div class="batch-wrap">
<table class="batch-table">
  <thead><tr>{% for c in columns %}<th>{{ c }}</th>{% endfor %}</tr></thead>
  <tbody>{% for r in df_rows %}<tr>{% for c in columns %}<td>{{ r[c] }}</td>{% endfor %}</tr>{% endfor %}</tbody>
</table>
</div>
{% endif %}
